<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Pokémon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Cadastro de Pokémon</h1>

  <div class="container">
    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="tipo" placeholder="Tipo">
    <input type="number" id="pc" placeholder="PC">
    <input type="text" id="treinador" placeholder="Treinador">
    
    <button type="button" id="btn-cadastrar">CADASTRAR</button>
    <button type="button" id="btn-limpar">LIMPAR</button>
  </div>

  <div id="container-cards"></div>

  <script src="script.js"></script>
</body>
</html>
